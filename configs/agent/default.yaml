critic:
  id: QTable
  gamma: 0.99
  lmbda: 0.95
  clip_reward: False
  batch_size: 1
  sequence_length: 1
  lr:
    id: LinearDecay
    init_value: 1.0
    end_value: 1.0
    rate: null
    steps: ${experiment.training_steps}
    constant_init_steps: ${experiment.warm_up}
    constant_end_steps: ${experiment.cool_down}
  approximator:
    id: MSETable
    init_value_min: 0.0
    init_value_max: 0.0

actor:
  id: EpsilonGreedy
  eps:
    id: LinearDecay
    init_value: 1.0
    end_value: 0.0
    rate: null
    steps: ${experiment.training_steps}
    constant_init_steps: ${experiment.warm_up}
    constant_end_steps: ${experiment.cool_down}
