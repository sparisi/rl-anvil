# @package _global_

agent:
  actor:
    id: EpsilonGreedyWithQVisit
    beta_bar: 0.01
    eps:
      id: Constant
      value: 0.0

  critic:
    id: QVisitTable
    gamma_visit: 0.99
    lmbda_visit: 0.95
    batch_size_visit: 1
    sequence_length_visit: 1
    lr_visit:
      id: LinearDecay
      init_value: 1.0
      end_value: 1.0
      steps: ${experiment.training_steps}
      constant_init_steps: ${experiment.warm_up}
      constant_end_steps: ${experiment.cool_down}
    approximator_visit:
      id: MSETable
      init_value_min: 0.0
      init_value_max: 0.0
