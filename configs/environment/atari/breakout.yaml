# @package _global_

environment:
  id: ALE/Breakout-v5
  train_from_pixels: True
  # https://github.com/Farama-Foundation/Shimmy/blob/main/shimmy/atari_env.py
  frameskip: 1
  repeat_action_probability: 0.0
  full_action_space: False
  max_num_frames_per_episode: 18_000  # as in Machado et al., 2018
  obs_type: rgb
  wrappers:
    - id: gymnasium.wrappers.AtariPreprocessing
    - id: gymnasium.wrappers.FrameStackObservation
      stack_size: 4

experiment:
  warm_up: 10_000
  cool_down: 10_000
  training_steps: 1_000_000
  testing_episodes: 10

agent:
  critic:
    batch_size: 512
    approximator:
      device: cpu
      hidden_size: 512
      encoder:
        id: ConvEncoder
        conv_channels: [32, 64, 64]
        conv_kernels: [8, 4, 3]
        conv_strides: [4, 2, 1]
        bias: False
