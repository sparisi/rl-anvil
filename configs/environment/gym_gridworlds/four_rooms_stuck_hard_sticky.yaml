# @package _global_

environment:
  id: Gym-Gridworlds/FourRooms-Stuck-13x13-Hard-v0
  wrappers:
    - id: gym_gridworlds.observation_wrappers.MatrixWrapper
    - id: gymnasium.wrappers.FlattenObservation
    - id: gymnasium.wrappers.StickyAction
      repeat_action_probability: 0.2
      repeat_action_duration: 2
  random_goals: False
  start_pos: [[1, 1]]

experiment:
  replay_memory:
    rho: null
  warm_up: 10_000
  cool_down: 10_000
  training_steps: 200_000
  testing_episodes: 50
