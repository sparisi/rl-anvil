# @package _global_

environment:
  id: Gym-Gridworlds/TravelField-12x12-v0
  wrappers:
    - id: gym_gridworlds.observation_wrappers.MatrixWrapper
    - id: gymnasium.wrappers.FlattenObservation
  max_resolution: [256, 256]
  distance_difference_reward: True

experiment:
  warm_up: 1
  cool_down: 0
  training_steps: 50_000
  testing_episodes: 1

agent:
  critic:
    gamma: 1.0
