# @package _global_

environment:
  id: CartPole-v1

experiment:
  warm_up: 10_000
  cool_down: 10_000
  training_steps: 200_000
  testing_episodes: 50

agent:
  critic:
    goal_idx: [0, 2]
    normalize_observation: True
    approximator:
      encoder:
        id: RawGridEncoder
        grid_id: GaussianActivation
        num_centers: 20
        v_max: 3.0
        centers_mode: learned
    approximator_visit:
      encoder:
        id: RawGridEncoder
        grid_id: GaussianActivation
        num_centers: 20
        v_max: 3.0
        centers_mode: learned
