# @package _global_

environment:
  id: LunarLander-v3
  wrappers:
    - id: src.wrappers.gym_wrappers.RandomActionWrapper
      random_action_prob: 0.2

experiment:
  warm_up: 10_000
  cool_down: 10_000
  training_steps: 300_000
  testing_episodes: 50

agent:
  critic:
    normalize_observation: True
    approximator:
      encoder:
        passthrough: [6, 7]  # last two obs are binary (leg contacts)
        id: RawGridEncoder
        grid_id: GaussianActivation
        num_centers: 20
        v_max: 3.0
        centers_mode: learned
    approximator_visit:
      encoder:
        id: RawGridEncoder
        grid_id: GaussianActivation
        num_centers: 20
        v_max: 3.0
        centers_mode: learned
