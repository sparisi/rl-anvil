default:
  - default

group_labels:
  sun_ratio_adaptive: "SUN (Mult.)"
  discover: "DISCOVER"
  sun_ucb_adaptive: "SUN (Additive)"

configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive
      plot.label: "SUN (Mult.)"
  discover:
    - algorithm: discover_episodic
      agent.actor.beta_novelty: 0.1
      plot.label: "$\\beta = 0.1$"
    - algorithm: discover_episodic
      agent.actor.beta_novelty: 1
      plot.label: "$\\beta = 1$"
    - algorithm: discover_episodic
      agent.actor.beta_novelty: 10
      plot.label: "$\\beta = 10$"
    - algorithm: discover_episodic
      agent.actor.beta_novelty: 100
      plot.label: "$\\beta = 100$"
    - algorithm: discover_episodic
      agent.actor.beta_novelty: 1_000
      plot.label: "$\\beta = 1,000$"
  sun_ucb_adaptive:
    - algorithm: sun_ucb_adaptive
      agent.actor.beta_novelty: 0.1
      plot.label: "$\\beta = 0.1$"
    - algorithm: sun_ucb_adaptive
      agent.actor.beta_novelty: 1
      plot.label: "$\\beta = 1$"
    - algorithm: sun_ucb_adaptive
      agent.actor.beta_novelty: 10
      plot.label: "$\\beta = 10$"
    - algorithm: sun_ucb_adaptive
      agent.actor.beta_novelty: 100
      plot.label: "$\\beta = 100$"
    - algorithm: sun_ucb_adaptive
      agent.actor.beta_novelty: 1_000
      plot.label: "$\\beta = 1,000$"
