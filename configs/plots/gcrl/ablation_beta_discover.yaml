default:
  - default

configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive
      plot.label: "SUN (Multipl.)"
  adagoal:
    - algorithm: adagoal
      plot.label: "AdaGoal"
  random:
    - algorithm: random
      plot.label: "Random"
  discover:
    - algorithm: discover
      agent.actor.beta_novelty: 0.1
      plot.label: "$\\beta = 0.1$"
    - algorithm: discover
      agent.actor.beta_novelty: 1
      plot.label: "$\\beta = 1$"
    - algorithm: discover
      agent.actor.beta_novelty: 10
      plot.label: "$\\beta = 10$"
    - algorithm: discover
      agent.actor.beta_novelty: 100
      plot.label: "$\\beta = 100$"
    - algorithm: discover
      agent.actor.beta_novelty: 1_000
      plot.label: "$\\beta = 1,000$"
