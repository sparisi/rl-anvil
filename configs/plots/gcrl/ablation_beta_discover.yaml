default:
  - default

configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive
      plot.label: "SUN (Multipl.)"
  sun_novelty_adaptive:
    - algorithm: sun_novelty_adaptive
      plot.label: "Novelty-Only"
  sun_reachability_adaptive:
    - algorithm: sun_reachability_adaptive
      plot.label: "Reach.-Only"
  discover:
    - algorithm: discover
      agent.actor.beta_novelty: 0.1
      plot.label: "$\\beta = 0.1$"
    - algorithm: discover
      agent.actor.beta_novelty: 1
      plot.label: "$\\beta = 1$"
    - algorithm: discover
      agent.actor.beta_novelty: 10
      plot.label: "$\\beta = 10$"
    - algorithm: discover
      agent.actor.beta_novelty: 100
      plot.label: "$\\beta = 100$"
    - algorithm: discover
      agent.actor.beta_novelty: 1_000
      plot.label: "$\\beta = 1,000$"
