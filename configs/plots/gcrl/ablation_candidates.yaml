default:
  - default

configs:
  discover:
    - algorithm: discover
      agent.actor.batch_size_goal: 256
      plot.label: "DISCOVER (256)"
    - algorithm: discover
      agent.actor.batch_size_goal: 2500
      plot.label: "DISCOVER (2500)"
    - algorithm: discover
      agent.actor.batch_size_goal: 10_000
      plot.label: "DISCOVER (10,000)"
  adagoal:
