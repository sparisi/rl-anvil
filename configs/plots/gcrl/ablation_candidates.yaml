      agent.actor.batch_size_goal: 10_000
      plot.label: "AdaGoal (10,000)"
  adagoal:
    - algorithm: sun_ratio_episodic
      agent.actor.batch_size_goal: 256
      plot.label: "SUN (Epis.) (256)"
    - algorithm: sun_ratio_episodic
      agent.actor.batch_size_goal: 2500
      plot.label: "SUN (Epis.) (2500)"
    - algorithm: sun_ratio_episodic
      agent.actor.batch_size_goal: 10_000
