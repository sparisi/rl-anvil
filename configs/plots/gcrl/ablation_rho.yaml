ignored_cfg_keys:
  - experiment.testing_episodes
  - agent.critic.approximator.device
  - agent.critic.approximator_visit.device

color_scheme:
  - sun_ratio_adaptive

configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive_binned
      experiment.replay_memory.rho: null
      plot.label: "True Counts"
      plot.color: purple
    - algorithm: sun_ratio_adaptive
      experiment.replay_memory.rho: 0.5
      plot.label: "$\\rho = 0.5$"
    - algorithm: sun_ratio_adaptive
      experiment.replay_memory.rho: 0.25
      plot.label: "$\\rho = 0.25$"
    - algorithm: sun_ratio_adaptive
      experiment.replay_memory.rho: 0.1
      plot.label: "$\\rho = 0.1$"
    - algorithm: sun_ratio_adaptive
      experiment.replay_memory.rho: 0.05
      plot.label: "$\\rho = 0.05$"
    - algorithm: sun_ratio_adaptive
      experiment.replay_memory.rho: 0.01
      plot.label: "$\\rho = 0.01$"

environments:
  control:
    gymnasium/mountain_car:
      label: "MountainCar"
      score_bounds: &unit_bounds
        sa_h: [0, 1]
        sa_%: [0, 1]
    gymnasium/pendulum_discrete:
      label: "Pendulum"
      score_bounds: *unit_bounds
    gymnasium/lunar_lander:
      label: "LunarLander"
      score_bounds: *unit_bounds
    gymnasium/acrobot:
      label: "Acrobot"
      score_bounds: *unit_bounds
    gymnasium/cart_pole:
      label: "CartPole"
      score_bounds: *unit_bounds

statistics:
  sa_h: "Entropy"
  sa_%: "Coverage"
