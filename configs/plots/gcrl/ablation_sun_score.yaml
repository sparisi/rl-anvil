    gym_gridworlds/four_rooms_stuck_hard: "FourRoomStuck"
    gym_gridworlds/travel_field_small: "GridMaze"
    gymnasium/mountain_car: "MountainCar"
    gymnasium/pendulum_discrete: "Pendulum"
    gymnasium/lunar_lander: "LunarLander"
    gymnasium/acrobot: "Acrobot"
    gymnasium/cart_pole: "CartPole"
  selection:
