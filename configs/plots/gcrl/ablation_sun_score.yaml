default:
  - default

legend_rows_cols: [2, 2]

configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive
      # plot.label: Multiplicative $\displaystyle {V^\theta(s_t, g)}/{n_g}$
      plot.label: Multiplicative
  sun_ucb_adaptive:
    - algorithm: sun_ucb_adaptive
      # plot.label: Additive $\displaystyle V^\theta(s_t, g) + \beta\textstyle{\sqrt{{\log N_\mathrm{tot}}/{n_g}}}$
      plot.label: Addititve
  sun_novelty_adaptive:
    - algorithm: sun_novelty_adaptive
      # plot.label: Novelty-Only $\displaystyle {1}/{n_g}$
      plot.label: Novelty-Only
  sun_reachability_adaptive:
    - algorithm: sun_reachability_adaptive
      # plot.label: Reachability-Only $\displaystyle V^\theta(s_t, g)$
      plot.label: Reach.-Only

environments:
  gridworlds_and_control:
    gym_gridworlds/three_rooms_wall_mini_nonuniform:
      label: "ThreeRoom"
      score_bounds: &unit_bounds
        sa_h: [0, 1]
        sa_%: [0, 1]
    gym_gridworlds/four_rooms_stuck_hard:
      label: "FourRoomStuck"
      score_bounds: *unit_bounds
    gym_gridworlds/travel_field_small:
      label: "GridMaze"
      score_bounds: *unit_bounds
    gymnasium/mountain_car:
      label: "MountainCar"
      score_bounds: *unit_bounds
    gymnasium/pendulum_discrete:
      label: "Pendulum"
      score_bounds: *unit_bounds
    gymnasium/lunar_lander:
      label: "LunarLander"
      score_bounds: *unit_bounds
    gymnasium/acrobot:
      label: "Acrobot"
      score_bounds: *unit_bounds
    gymnasium/cart_pole:
      label: "CartPole"
      score_bounds: *unit_bounds
  selection:
    gym_gridworlds/three_rooms_wall_mini_nonuniform:
      label: "ThreeRoom"
      score_bounds: *unit_bounds
    gym_gridworlds/four_rooms_stuck_hard:
      label: "FourRoomStuck"
      score_bounds: *unit_bounds
    gymnasium/mountain_car:
      label: "MountainCar"
      score_bounds: *unit_bounds
