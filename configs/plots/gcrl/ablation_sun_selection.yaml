default:
  - default

configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive
      plot.label: "Adaptive"
  sun_ratio_step:
    - algorithm: sun_ratio_step
      plot.label: "Per-Step"
  sun_ratio_episodic:
    - algorithm: sun_ratio_episodic
      plot.label: "Episodic"

environments:
  gridworlds_and_control:
    gym_gridworlds/three_rooms_wall_mini_nonuniform:
      label: "ThreeRoom"
      score_bounds: &unit_bounds
        sa_h: [0, 1]
        sa_%: [0, 1]
    gym_gridworlds/four_rooms_stuck_hard:
      label: "FourRoomStuck"
      score_bounds: *unit_bounds
    gym_gridworlds/travel_field_small:
      label: "GridMaze"
      score_bounds: *unit_bounds
    gymnasium/mountain_car:
      label: "MountainCar"
      score_bounds: *unit_bounds
    gymnasium/pendulum_discrete:
      label: "Pendulum"
      score_bounds: *unit_bounds
    gymnasium/lunar_lander:
      label: "LunarLander"
      score_bounds: *unit_bounds
    gymnasium/acrobot:
      label: "Acrobot"
      score_bounds: *unit_bounds
    gymnasium/cart_pole:
      label: "CartPole"
      score_bounds: *unit_bounds
  selection:
    gym_gridworlds/three_rooms_wall_mini_nonuniform:
      label: "ThreeRoom"
      score_bounds: *unit_bounds
    gym_gridworlds/four_rooms_stuck_hard:
      label: "FourRoomStuck"
      score_bounds: *unit_bounds
    gymnasium/mountain_car:
      label: "MountainCar"
      score_bounds: *unit_bounds

statistics:
  sa_h: "Entropy"
  sa_%: "Coverage"
  goal_reselections_%: "Goal Re-Selections (%)"
