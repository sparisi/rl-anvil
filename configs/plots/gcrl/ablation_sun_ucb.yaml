      tuned: rho
      agent.actor.beta_novelty: 0.1
      plot.label: "$\\beta = 0.1$"
    - algorithm: sun_ucb_step
      tuned: rho
      agent.actor.beta_novelty: 1
      plot.label: "$\\beta = 1$"
    - algorithm: sun_ucb_step
      tuned: rho
      agent.actor.beta_novelty: 10
      plot.label: "$\\beta = 10$"
    - algorithm: sun_ucb_step
      tuned: rho
