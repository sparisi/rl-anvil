      plot.label: "$\\beta = 10$"
    - algorithm: sun_ucb_episodic
      tuned: rho
      agent.actor.beta_novelty: 100
      plot.label: "$\\beta = 100$"
    - algorithm: sun_ucb_episodic
      tuned: rho
