# @package _global_

# Keys to be ignored when matching configs
ignored_cfg_keys:
  - experiment.testing_episodes
  - agent.critic.approximator.device
  - agent.critic.approximator_visit.device

# plots_rows_cols: [1, -1]  # defines how to arrange subplots (optional; default = one row)
# legend_rows_cols: [1, -1]  # defines how to arrange legend entries

color_scheme:
  - sun_ratio_adaptive
  - adagoal
  - discover
  - random
  - sun_ratio_episodic
  - sun_ratio_step
  - sun_ucb_adaptive
  - sun_novelty_adaptive
  - sun_reachability_adaptive
  - sun_ratio_adaptive_binned

# Configurations to plot and their legend labels.
# One group per algorithm, so each of them is a hue of its own.
# Configurations not listed here are not plotted.
configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive
      plot.label: "SUN"
  adagoal:
    - algorithm: adagoal
      plot.label: "AdaGoal"
  discover:
    - algorithm: discover
      plot.label: "DISCOVER"
  random:
    - algorithm: random
      plot.label: "Random"

# Statistics to plot and their y-axis labels.
# Keys are statistic names (from .npz files); values are display names.
# Statistics not listed here are not plotted.
statistics:
  sa_h: "Entropy"
  sa_%: "Coverage"

# Environments to plot and their figure title labels.
# Keys are environment YAML names (from configs/environment/); values are display names.
# If environments are grouped, they will be plotted separately.
environments:
  gridworlds_and_control:
    gym_gridworlds/three_rooms_wall_mini_nonuniform:
      label: "ThreeRoom"
      score_bounds: &unit_bounds
        sa_h: [0, 1]
        sa_%: [0, 1]
    gym_gridworlds/four_rooms_stuck_hard:
      label: "FourRoomStuck"
      score_bounds: *unit_bounds
    gym_gridworlds/travel_field_small:
      label: "GridMaze"
      score_bounds: *unit_bounds
    gymnasium/mountain_car:
      label: "MountainCar"
      score_bounds: *unit_bounds
    gymnasium/pendulum_discrete:
      label: "Pendulum"
      score_bounds: *unit_bounds
    gymnasium/lunar_lander:
      label: "LunarLander"
      score_bounds: *unit_bounds
    gymnasium/acrobot:
      label: "Acrobot"
      score_bounds: *unit_bounds
    gymnasium/cart_pole:
      label: "CartPole"
      score_bounds: *unit_bounds
