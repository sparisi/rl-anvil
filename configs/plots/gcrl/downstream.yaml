ignored_cfg_keys:
  - agent.critic.approximator.device
  - agent.critic.approximator_visit.device

default:
  - default

configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive
      agent.critic.explore_only: False
      plot.label: "SUN"
  adagoal:
    - algorithm: adagoal
      agent.critic.explore_only: False
      plot.label: "AdaGoal"
  discover:
    - algorithm: discover
      agent.critic.explore_only: False
      plot.label: "DISCOVER"
  random:
    - algorithm: random
      agent.critic.explore_only: False
      plot.label: "Random"
  eps_greedy:
    - algorithm: eps_greedy
      agent.critic.explore_only: False
      plot.label: "ε-greedy"

statistics:
  "train (γ)": "Train Return (γ)"
  "test (γ)": "Test Return (γ)"

environments:
  gridworlds_and_control:
