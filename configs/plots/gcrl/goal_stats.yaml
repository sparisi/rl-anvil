default:
  - default

per_env_plot:
  show: True
  rows_cols: [-1, 2]

configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive
      tuned: rho
      plot.label: "SUN"
    - algorithm: sun_ratio_step
      tuned: rho
      plot.label: "SUN (Step)"
    - algorithm: sun_ratio_episodic
      tuned: rho
      plot.label: "SUN (Epis.)"
  adagoal:
    - algorithm: adagoal_episodic
      plot.label: "AdaGoal"
  discover:
    - algorithm: discover_episodic
      tuned: beta
      plot.label: "DISCOVER"

statistics:
  sa_h: "Entropy"
  sa_%: "Coverage"
  goal_success_%: "Goal Success (%)"
  avg_steps_to_goal: "Steps-To-Goal"
  goal_reselections_%: "Goal Re-Selections (%)"
  random_tail_steps_%: "Random Exploration (%)"
