default:
  - default

per_env_plot:
  show: True
  rows_cols: [-1, 2]

configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive
      tuned: rho
      plot.label: "SUN"
    - algorithm: sun_ratio_step
      tuned: rho
      plot.label: "SUN (Step)"
    - algorithm: sun_ratio_episodic
      tuned: rho
      plot.label: "SUN (Epis.)"
  adagoal:
    - algorithm: adagoal_episodic
      plot.label: "AdaGoal"
  discover:
    - algorithm: discover_episodic
      tuned: beta
      plot.label: "DISCOVER"

environments:
  gymnasium/mountain_car:
    label: "Mountain Car"
    score_bounds:
      sa_h: [0, 1]
      sa_%: [0, 1]
