default:
  - default

configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive
      plot.label: "SUN (Adapt., Multipl.)"
  sun_ucb_adaptive:
    - algorithm: sun_ucb_adaptive
      plot.label: "SUN (Adapt., Additive)"
  sun_ratio_step:
    - algorithm: sun_ratio_step
      plot.label: "SUN (Per-Step, Multipl.)"
  sun_ratio_episodic:
    - algorithm: sun_ratio_episodic
      plot.label: "SUN (Epis., Multipl.)"
  adagoal:
    - algorithm: adagoal_episodic
      plot.label: "AdaGoal"
  discover:
    - algorithm: discover_episodic
      plot.label: "DISCOVER"
  random:
    - algorithm: random
      plot.label: "Random"
