default:
  - default

configs:
  sun_ratio_adaptive_baseline:
    - algorithm: sun_ratio_adaptive
      plot.label: "SUN"
      plot.color: purple
  sun_ratio_adaptive:
    - algorithm: sun_ratio_episodic
      plot.label: "SUN (Epis.)"
      plot.color: "#0173B2"
    - algorithm: sun_ratio_success
      plot.label: "SUN (At Success)"
      plot.color: "#0173B2"
  adagoal:
    - algorithm: adagoal_episodic
      plot.label: "AdaGoal (Epis.)"
      plot.color: "#DE8F05"
    - algorithm: adagoal_success
      plot.label: "AdaGoal (At Success)"
      plot.color: "#DE8F05"
  discover:
    - algorithm: discover_episodic
      plot.label: "DISCOVER (Epis.)"
      plot.color: "#029E73"
    - algorithm: discover_success
      plot.label: "DISCOVER (At Success)"
      plot.color: "#029E73"

environments:
  gridworlds_and_control:
    gym_gridworlds/three_rooms_wall_mini_nonuniform:
      label: "ThreeRoom"
      score_bounds: &unit_bounds
        sa_h: [0, 1]
        sa_%: [0, 1]
    gym_gridworlds/four_rooms_stuck_hard:
      label: "FourRoomStuck"
      score_bounds: *unit_bounds
    gym_gridworlds/travel_field_small:
      label: "GridMaze"
      score_bounds: *unit_bounds
    gymnasium/mountain_car:
      label: "MountainCar"
      score_bounds: *unit_bounds
    gymnasium/pendulum_discrete:
      label: "Pendulum"
      score_bounds: *unit_bounds
    gymnasium/lunar_lander:
      label: "LunarLander"
      score_bounds: *unit_bounds
    gymnasium/acrobot:
      label: "Acrobot"
      score_bounds: *unit_bounds
    gymnasium/cart_pole:
      label: "CartPole"
      score_bounds: *unit_bounds
