# rl-anvil's configs/plots/gcrl/ablation_beta.yaml at 803d261 plus a SUN (Multipl.)
# violin in front of the two sweeps (owner's request, 2026-11-14; rl-anvil's repository
# has no such config at that commit).
default:
  - default

configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive
      plot.label: "SUN (Multipl.)"
  discover:
    - algorithm: discover
      agent.actor.beta_novelty: 0.1
      plot.label: "$\\beta = 0.1$"
    - algorithm: discover
      agent.actor.beta_novelty: 1
      plot.label: "$\\beta = 1$"
    - algorithm: discover
      agent.actor.beta_novelty: 10
      plot.label: "$\\beta = 10$"
    - algorithm: discover
      agent.actor.beta_novelty: 100
      plot.label: "$\\beta = 100$"
    - algorithm: discover
      agent.actor.beta_novelty: 1_000
      plot.label: "$\\beta = 1,000$"
  sun_ucb_adaptive:
    - algorithm: sun_ucb_adaptive
      agent.actor.beta_novelty: 0.1
      plot.label: "$\\beta = 0.1$"
    - algorithm: sun_ucb_adaptive
      agent.actor.beta_novelty: 1
      plot.label: "$\\beta = 1$"
    - algorithm: sun_ucb_adaptive
      agent.actor.beta_novelty: 10
      plot.label: "$\\beta = 10$"
    - algorithm: sun_ucb_adaptive
      agent.actor.beta_novelty: 100
      plot.label: "$\\beta = 100$"
    - algorithm: sun_ucb_adaptive
      agent.actor.beta_novelty: 1_000
      plot.label: "$\\beta = 1,000$"
