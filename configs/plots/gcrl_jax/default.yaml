# @package _global_
# The JaxGCRL panels of the GCRL figures: same colours, shades and line styles as
# configs/plots/gcrl/default.yaml, over the five JaxGCRL tasks.
#
# The statistics are s_% and s_h, not sa_% and sa_h: the JAX runs log visited
# goals only, so coverage and entropy are over the 50 x 50 goal grid restricted
# to the reachable support (maze corridors, gripper sector), each normalised to
# [0, 1] by that support.

ignored_cfg_keys:
  - experiment.testing_episodes
  - agent.critic.approximator.device
  - agent.critic.approximator_visit.device

color_scheme:
  - sun_ratio_adaptive
  - adagoal
  - discover
  - random
  - sun_ratio_episodic
  - sun_ratio_step
  - sun_ucb_adaptive
  - sun_novelty_adaptive
  - sun_reachability_adaptive
  - sun_ratio_adaptive_binned

configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive
      plot.label: "SUN"
  adagoal:
    - algorithm: adagoal
      plot.label: "AdaGoal"
  discover:
    - algorithm: discover
      plot.label: "DISCOVER"
  random:
    - algorithm: random
      plot.label: "Random"

statistics:
  s_%: "Coverage"
  s_h: "Entropy"

environments:
  jaxgcrl:
    jaxgcrl/point_maze_simple:
      label: "PointMaze-S"
      score_bounds: &unit_bounds
        s_h: [0, 1]
        s_%: [0, 1]
    jaxgcrl/point_maze_hard:
      label: "PointMaze-H"
      score_bounds: *unit_bounds
    jaxgcrl/ant_maze_simple:
      label: "AntMaze-S"
      score_bounds: *unit_bounds
    jaxgcrl/ant_maze_hard:
      label: "AntMaze-H"
      score_bounds: *unit_bounds
    jaxgcrl/arm_push_hard:
      label: "ArmPush-H"
      score_bounds: *unit_bounds
