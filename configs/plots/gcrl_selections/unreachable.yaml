default:
  - gcrl/default

configs:
  sun_ratio_adaptive:
    - algorithm: sun_ratio_adaptive
      plot.label: "SUN"
  sun_ratio_step:
    - algorithm: sun_ratio_step
      plot.label: "SUN (Step)"
  sun_ratio_episodic:
    - algorithm: sun_ratio_episodic
      plot.label: "SUN (Epis.)"
  sun_ucb_adaptive:
    - algorithm: sun_ucb_adaptive
      plot.label: "SUN (Add.)"
  sun_reachability_adaptive:
    - algorithm: sun_reachability_adaptive
      plot.label: "Reach.-Only"
  sun_novelty_adaptive:
    - algorithm: sun_novelty_adaptive
      plot.label: "Novelty-Only"
  adagoal:
    - algorithm: adagoal
      plot.label: "AdaGoal"
  discover:
    - algorithm: discover
      plot.label: "DISCOVER"
  random:
    - algorithm: random
      plot.label: "Random"

statistics:
  sa_h: "Entropy"
  sa_%: "Coverage"

environments:
  gridworlds:
    gym_gridworlds/three_rooms_wall_mini_nonuniform:
      label: "ThreeRoom"
      score_bounds: &unit_bounds
        sa_h: [0, 1]
        sa_%: [0, 1]
    gym_gridworlds/four_rooms_stuck_hard:
      label: "FourRoomStuck"
      score_bounds: *unit_bounds
    gym_gridworlds/four_rooms_stuck_hard_sticky:
      label: "FourRoomStuck (Sticky Act.)"
      score_bounds: *unit_bounds
